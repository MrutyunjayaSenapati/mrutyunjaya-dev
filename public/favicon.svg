<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14120f" />
      <stop offset="100%" stop-color="#0c0b09" />
    </linearGradient>
  </defs>

  <!-- Warm Charcoal Background with Ember Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#e8843c" stroke-width="2.5" />

  <!-- Ember Active Accent Dot -->
  <circle cx="50" cy="14" r="3.5" fill="#f59e0b" />

  <!-- Monogram "MS" -->
  <text
    x="30"
    y="43"
    font-family="'Space Grotesk', 'JetBrains Mono', system-ui, -apple-system, sans-serif"
    font-size="27"
    font-weight="800"
    letter-spacing="-1.5"
    fill="#fb923c"
    text-anchor="middle"
  >MS</text>
</svg>
